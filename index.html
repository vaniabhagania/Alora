<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#e9e4d8" />
    <title>ALORA Personal AI OS</title>
    <meta name="description" content="ALORA — your personal academic companion and second brain." />
    <script>
      // Apply the last-used theme BEFORE first paint so dark-mode users never see a light flash.
      try { if (localStorage.getItem('alora-theme-mode') === 'dark') document.documentElement.setAttribute('data-theme', 'dark'); } catch (e) {}
    </script>
    <style>
      html[data-theme="dark"] {
        --bg-primary: #201e29; --bg-secondary: #2a2735; --text-primary: #f2efe8; --text-secondary: #a39cb0;
        --ink-rgb: 242 239 232; --card-bg: rgba(255,255,255,0.045); color-scheme: dark;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
